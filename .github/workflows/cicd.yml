name: Week 2 CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "Week2/cicd-pipeline/**"
      - ".github/workflows/cicd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "Week2/cicd-pipeline/**"
      - ".github/workflows/cicd.yml"

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Week2/cicd-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Week2/cicd-pipeline/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  docker:
    name: Build and Verify Docker Image
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: Week2/cicd-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t icp-cicd-app:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run --rm -d \
            --name icp-cicd-app \
            -p 5000:5000 \
            icp-cicd-app:${{ github.sha }}

      - name: Verify application health
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo
              echo "Application health check passed."
              exit 0
            fi

            echo "Waiting for application... attempt ${attempt}/10"
            sleep 2
          done

          echo "Application failed to become healthy."
          docker logs icp-cicd-app
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs icp-cicd-app || true

      - name: Stop Docker container
        if: always()
        run: docker stop icp-cicd-app || true
